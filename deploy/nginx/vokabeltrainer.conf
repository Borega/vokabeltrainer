# nginx als Reverse-Proxy für den Vokabeltrainer
#
#   Browser ──HTTPS──> nginx (dieser Server) ──HTTP──> Docker-Host 192.0.2.10:3000 (Portainer-Stack)
#
# Installation:
#   1. DNS: vokabeln.meine-schule.de auf diesen nginx-Server zeigen lassen
#      Alle Vorkommen von vokabeln.meine-schule.de und 192.0.2.10 (Beispiel-IP) ersetzen.
#   2. Zertifikat: z. B. ein vorhandenes Wildcard-Zertifikat (*.meine-schule.de) verwenden.
#      Abdeckung prüfen:  openssl x509 -in /pfad/zum/zertifikat.pem -noout -ext subjectAltName
#      Oder ein eigenes holen:  sudo certbot certonly --nginx -d vokabeln.meine-schule.de
#   3. Datei nach /etc/nginx/sites-available/ kopieren, nach sites-enabled/ verlinken, dann:
#        sudo nginx -t && sudo systemctl reload nginx
#
# Passend dazu im Portainer-Stack:
#   BIND_IP=192.0.2.10
#   BASE_URL=https://vokabeln.meine-schule.de
# Redirect-URI in IServ: https://vokabeln.meine-schule.de/auth/callback
#
# Kein Rate-Limiting pro IP: Ganze Klassen sitzen hinter einer IP und würden sich sonst aussperren.

upstream vokabeltrainer {
    server 192.0.2.10:3000;   # Docker-Host, Port aus dem Portainer-Stack (HOST_PORT)
    keepalive 16;
}

server {
    server_name vokabeln.meine-schule.de;

    listen 443 ssl;
    ssl_certificate     /etc/ssl/certs/meine-schule.pem;      # anpassen
    ssl_certificate_key /etc/ssl/private/meine-schule.key;    # anpassen
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:TLS_AES_128_CCM_8_SHA256:TLS_AES_128_CCM_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Die App setzt CSP, nosniff und Referrer-Policy selbst; hier nur HSTS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Große Wortlisten (die App erlaubt bis 2 MB JSON)
    client_max_body_size 3m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        # Die App spricht intern nur HTTP.
        proxy_pass http://vokabeltrainer;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/vokabeltrainer.access.log;
    error_log /var/log/nginx/vokabeltrainer.error.log;
}

# HTTP → HTTPS
server {
    listen 80;
    server_name vokabeln.meine-schule.de;
    return 301 https://$host$request_uri;
}
